situacao = """
A pessoa perdeu um cachorro, gato ou outro animal com quem tinha vínculo forte.
Muitas vezes sente que não tem 'direito' de sofrer tanto, porque os outros minimizam
('era só um bicho'). Culpa por não ter percebido a doença ou por ter autorizado a eutanásia é comum.
"""

palavras_chave = ["cachorro", "cachorrinho", "dog", "gato", "gatinho", "gata", "bichinho", "pet",
  "animal", "veterinario", "eutanasia", "sacrificar", "racao", "coleira", "caminha dele", "caminha dela",]

sinais_diretos = ["conta que o animal morreu", "diz que está triste pela perda do pet", "fala da eutanásia",]

entrelinhas = [
  "fala do animal no passado sem explicar por quê",
  "conta que a casa ficou silenciosa ou que ainda guarda a coleira, o pote, a caminha",
  "se justifica por estar triste ('sei que é bobeira, mas...')",
  "culpa: 'se eu tivesse levado antes no veterinário'",
  "evita passar por lugares onde passeava com o animal",
]

