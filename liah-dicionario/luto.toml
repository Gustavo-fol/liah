]

como_responder = """
1. Validar que o luto por um animal é real e legítimo: ele era da família.
2. Nunca minimizar nem sugerir 'pegar outro'.
3. Se houver culpa, acolher sem julgamento e lembrar que a pessoa agiu com o que sabia na época.
4. Convidar a pessoa a contar uma lembrança boa do animal (o nome, uma mania).
5. Se o sofrimento durar muitas semanas ou atrapalhar a rotina, sugerir conversar com um psicólogo.
"""

evitar = ["dizer 'era só um animal'", "sugerir adotar outro logo", "frases prontas como 'ele virou estrelinha'",]

resposta_modelo = """
Sinto muito pela sua perda. Ele não era 'só um animal', era parte da sua família, e é natural a casa
parecer vazia agora. A culpa que você descreve aparece muito no luto, mas você cuidou dele com o que
sabia naquele momento. Se quiser, me conta como ele se chamava e do que mais gostava de fazer?
"""

[[contexto]]
id = "luto-familiar-proximo"
titulo = "Morte de familiar próximo (pai, mãe, avós, irmãos)"
nivel_risco = "atencao"
encaminhamento = "psicologo"
aprovado = false
revisado_por = ""

situacao = """
Morte recente ou não tão recente de alguém central na vida da pessoa. Pode vir com choque,
raiva, culpa por coisas não ditas, sobrecarga com burocracias e com a família, e mudança brusca
de papel (ter que cuidar de alguém, assumir contas). Luto intenso aumenta o risco de depressão.
"""

palavras_chave = ["faleceu", "falecimento", "morreu", "morte", "velorio", "enterro", "funeral", "cemiterio",
  "luto", "minha mae", "meu pai", "minha vo", "meu vo", "minha avo", "meu avo", "meu irmao", "minha irma",
  "inventario", "missa de setimo dia", "partiu",]

sinais_diretos = ["conta que o familiar morreu", "fala do velório ou enterro", "diz que não consegue aceitar",]

entrelinhas = [
  "fala da pessoa no passado ou corrige o tempo verbal",
  "menciona papelada, inventário, ter que esvaziar a casa ou o quarto",
  "conta que ainda manda mensagem ou liga para o número da pessoa",
  "culpa por uma briga, uma visita que não fez ou algo que não disse",
  "diz que 'tem que ser forte' pelos outros e não chora",
  "datas e cheiros disparam a lembrança",
]

falas_diretas = [
  "minha mãe faleceu mês passado e eu não sei como continuar",
  "o enterro do meu avô foi ontem",
  "meu pai morreu e eu não consegui me despedir",
]

falas_sutis = [
  "hoje fui arrumar o guarda-roupa dela e não consegui terminar",
  "ainda tenho o áudio dele no whatsapp, escuto toda noite",
  "agora sou eu que tenho que resolver tudo, cartório, banco, tudo",
  "todo mundo diz que eu tô sendo muito forte, mas ninguém sabe",
  "a última coisa que eu falei pra ele foi grosseria",
  "o almoço de domingo nunca mais vai ser igual",
]

nao_confundir = [
  "minha avó tá internada, mas tá melhorando",
  "meu pai vive me cobrando por nota",
  "assisti um filme sobre morte e fiquei pensativo",
]

como_responder = """
1. Dar os pêsames de forma simples e humana; perguntar o nome da pessoa e como era a relação.
2. Normalizar emoções misturadas: tristeza, raiva, alívio, culpa.
3. Se houver culpa por algo não dito, acolher e oferecer a ideia de escrever uma carta ou falar em voz alta.
4. Perguntar como a pessoa está dormindo e comendo, e se tem alguém por perto.
5. Sugerir apoio de psicólogo (luto é um bom motivo para começar terapia) e grupos de apoio ao luto.
6. Ficar atento a frases de querer 'ir junto' ou 'não ver sentido': isso muda o risco.
"""

evitar = ["'ele está num lugar melhor' (pode ferir quem não tem fé)", "'o tempo cura tudo'", "comparar perdas",]

resposta_modelo = """
Sinto muito, de verdade. Perder alguém tão importante mexe com tudo, e é muito peso ter que ser forte
para os outros e ainda resolver burocracias ao mesmo tempo. Não existe jeito certo de viver o luto.
Como você tem conseguido dormir e se cuidar nesses dias? Conversar com um psicólogo pode ajudar muito
a atravessar esse momento, e eu fico aqui com você também.
"""

