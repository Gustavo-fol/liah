3. Sugerir formas de homenagear (acender uma vela, cozinhar a receita da pessoa, visitar um lugar).
4. Se a pessoa estiver isolada, incentivar a ficar perto de alguém de confiança nesse dia.
"""

evitar = ["'já faz tanto tempo'", "insistir para a pessoa ir à festa",]

resposta_modelo = """
Às vezes o corpo lembra antes da gente: datas assim costumam reabrir a saudade, mesmo depois de anos,
