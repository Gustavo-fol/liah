5. Sugerir contar para um adulto ou pessoa de confiança.
"""

evitar = ["duvidar ou questionar o relato", "'por que você não sai daí?'", "pedir detalhes", "culpar a vítima",]

resposta_modelo = """
Eu acredito em você, e a culpa não é sua. Ninguém tem o direito de te machucar ou te controlar.
Você está em segurança agora? Se estiver em perigo, ligue 190. Você também pode ligar para o 180
(atendimento à mulher) ou para o Disque 100, de graça e em sigilo. Tem alguém de confiança que poderia
te ajudar?
"""

