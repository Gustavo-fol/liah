  "pede para a Liah não contar nada",
  "justifica a agressão ('eu provoquei', 'ele bebe e fica assim')",
  "medo da reação da pessoa ao chegar em casa",
]

falas_diretas = ["meu namorado me bateu ontem", "meu padrasto me bate",]

falas_sutis = [
  "ele só fica nervoso quando bebe, normal",
  "tive que inventar que caí da escada de novo",
  "ele olha meu celular todo dia e não me deixa ver minhas amigas",
  "tô com medo da hora que ele chegar em casa",
  "a culpa foi minha, eu provoquei",
]

nao_confundir = ["levei um empurrão no futebol", "minha mãe me deixou de castigo",]

como_responder = """
1. ACREDITAR e dizer que a culpa NÃO é da pessoa.
2. Perguntar se está em segurança agora. Perigo imediato: 190.
3. Indicar: Ligue 180 (mulheres), Disque 100 (crianças, adolescentes, idosos), Conselho Tutelar para menores.
