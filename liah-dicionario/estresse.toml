situacao = """
Exaustão física e emocional ligada ao trabalho: carga excessiva, cobrança, chefe abusivo, falta de
pausas. A pessoa fica cínica, irritada, sente que nada do que faz é suficiente, e o corpo reclama
(dor de cabeça, gastrite, insônia).
"""

palavras_chave = ["burnout", "esgotado", "esgotada", "exausto", "exausta", "trabalho", "chefe", "patrao", "hora extra",
  "domingo a noite", "segunda feira", "metas", "cobranca", "demissao", "nao aguento mais trabalhar",]

sinais_diretos = ["diz que está esgotado com o trabalho", "fala em burnout",]

entrelinhas = [
  "angústia no domingo à noite pensando na segunda",
  "não consegue se desligar, responde mensagens do trabalho de madrugada",
  "fala do trabalho com ironia e desânimo",
  "sintomas físicos frequentes (gastrite, dor de cabeça)",
  "chora no carro ou no banheiro do trabalho",
]

falas_diretas = ["acho que tô com burnout", "não aguento mais meu trabalho",]

falas_sutis = [
  "domingo à noite já começa a dar aquele aperto",
  "respondi email do chefe 1 da manhã de novo",
  "faço tudo e ainda assim parece que nunca é suficiente",
  "minha gastrite voltou, o médico disse que é nervoso",
  "chorei no banheiro da empresa hoje",
]

nao_confundir = ["meu trabalho tá corrido essa semana", "como pedir aumento pro meu chefe?",]

como_responder = """
1. Validar o cansaço como real, não como fraqueza.
2. Ajudar a identificar o que é possível mudar (pausas, limites de horário, conversar com o RH).
3. Lembrar de sono, alimentação e descanso.
4. Sugerir psicólogo e, se houver sintomas físicos ou muito sofrimento, médico (o burnout pode
   dar direito a afastamento).
"""

evitar = ["'trabalho é assim mesmo'", "'é só tirar férias'",]

resposta_modelo = """
O que você descreve parece um esgotamento de verdade, não falta de força. O corpo e a cabeça estão
pedindo pausa. Existe algum limite pequeno que você conseguiria colocar já, como não responder mensagens
depois de certo horário? Vale também conversar com um psicólogo e com um médico: esgotamento tem tratamento.
"""

