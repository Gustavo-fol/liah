# Configuração das ferramentas de qualidade (o "ruff" confere o código Python).
# Rodar:  ruff check .   (dentro de liah-backend)
[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W = estilo básico, F = erros reais (variável não usada, nome errado), B = armadilhas comuns
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B904"]   # "raise ... from" já usamos onde importa
