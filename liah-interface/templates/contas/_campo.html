{# Pedaço reaproveitado: desenha UM campo (rótulo, caixa, ajuda e erros). #}
<div class="campo{% if campo.errors %} com-erro{% endif %}">
  {% if campo.field.widget.input_type == "checkbox" %}
    <label class="check">{{ campo }} <span>{{ campo.label }}</span></label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<div class="ajuda">{{ campo.help_text|safe }}</div>{% endif %}
  {% for erro in campo.errors %}<div class="erro">{{ erro }}</div>{% endfor %}
</div>
